<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Title, description, canonical, Open Graph, Twitter Card and JSON-LD are
      managed per-route by the <Seo> component (react-helmet-async) and are
      injected here at build time by scripts/prerender.ts.
    -->

    <!-- Technical Meta Tags -->
    <meta name="robots" content="index, follow" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="theme-color" content="#ffc614" />
    <meta name="msapplication-TileColor" content="#ffc614" />
    <meta name="msapplication-config" content="/browserconfig.xml" />

    <!-- Favicon and App Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Social Links for Indexing -->
    <link rel="me" href="https://www.linkedin.com/in/fj-lessing/" />
    <link rel="me" href="https://github.com/FJLessing" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
